# flip_pages — Mirror pages horizontally or vertically (a true flip, not a rotation).
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - flip_pages:
      direction: horizontal
output:
  file: output/flip_pages.pdf

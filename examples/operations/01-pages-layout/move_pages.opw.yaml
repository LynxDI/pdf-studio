# move_pages — Move pages to a new position, leaving every other page where it is.
#
# Backend: bundled engine — runs with nothing installed.
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - move_pages:
      pages:
        - 2
        - 5-6
      after: 1
output:
  file: output/move_pages.pdf

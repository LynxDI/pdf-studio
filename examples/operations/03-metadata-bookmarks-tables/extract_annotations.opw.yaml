# extract_annotations — Extract every markup/comment annotation — sticky notes, highlights, underlines, strikeouts, free text, shapes, ink and stamps — with author, comment text, the text a markup covers, color, rectangle and dates, to JSON + CSV. Point `inputs` at one PDF or a whole folder (docs/*.pdf → one combined table with a source-file column). Read-only. (Hyperlinks → extract_links; form fields → extract_fields.)
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - extract_annotations: {}
output:
  folder: output/extract_annotations

# extract_bookmarks — Export the outline/bookmarks as JSON.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - extract_bookmarks:
      to: output/bookmarks.json
output:
  file: output/extract_bookmarks.pdf

# extract_text — Extract page text to a sidecar artifact, optionally cleaned up (headers/footers, hyphenation, reflow).
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - extract_text:
      to: output/text.txt
      clean: true
output:
  file: output/extract_text.pdf

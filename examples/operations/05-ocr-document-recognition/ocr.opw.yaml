# ocr — Add a searchable text layer via OCR (Tesseract). Modes for filling gaps, re-OCR'ing, or forcing.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - ocr:
      language: eng
output:
  file: output/ocr.pdf

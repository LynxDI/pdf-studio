# auto_redact — Find and permanently redact matching text — literal strings, regexes, or PII presets (ssn/email/phone/…).
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - auto_redact:
      patterns:
        - email
        - ssn
output:
  file: output/auto_redact.pdf

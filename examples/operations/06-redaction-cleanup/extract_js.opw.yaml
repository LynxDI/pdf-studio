# extract_js — Surface any embedded JavaScript (document Names tree + open action) to a report for inspection. Read-only; use `sanitize` to remove it.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - extract_js:
      to: output/js.md
output:
  file: output/extract_js.pdf

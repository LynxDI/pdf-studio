# remove_annotations — Remove all annotations (comments, highlights, links markup).
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - remove_annotations: {}
output:
  file: output/remove_annotations.pdf

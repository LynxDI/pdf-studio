# unlock_forms — Clear the read-only flag on form fields so they can be filled.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - unlock_forms: {}
output:
  file: output/unlock_forms.pdf

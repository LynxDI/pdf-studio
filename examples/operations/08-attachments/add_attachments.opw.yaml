# add_attachments — Embed a file as an attachment.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - add_attachments:
      file: input/notes.md
      name: notes.md
output:
  file: output/add_attachments.pdf

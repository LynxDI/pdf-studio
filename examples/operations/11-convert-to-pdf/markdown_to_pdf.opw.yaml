# markdown_to_pdf — Render a Markdown file to a styled PDF (Markdown → themed HTML → PDF).
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/notes.md
operations:
  - markdown_to_pdf:
      engine: auto
output:
  file: output/markdown_to_pdf.pdf

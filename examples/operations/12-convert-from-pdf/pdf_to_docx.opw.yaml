# pdf_to_docx — Convert a PDF to a Word document (fidelity varies).
#
# Backend: LibreOffice — install it and this op lights up (the Dependencies view has the install command).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - pdf_to_docx:
      to: output/out.docx
output:
  file: output/pdf_to_docx.pdf

# pdf_to_pptx — Convert a PDF to a PowerPoint presentation (fidelity varies).
#
# Backend: LibreOffice — install it and this op lights up (the Dependencies view has the install command).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - pdf_to_pptx:
      to: output/out.pptx
output:
  file: output/pdf_to_pptx.pdf

# translate — Translate the PDF's text to a target language with an LLM and write the translated Markdown. Uses a local model by default (Ollama); requires the pdfStudio.allowAiRequests setting.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# NOT runnable as-is: needs an LLM (Ollama/allowAiRequests off). This example shows the syntax — provide your own input.
version: 1
kind: pdf
inputs:
  - user-guide.pdf
operations:
  - translate: { lang: Spanish, layout: true }
output:
  file: output/user-guide-es.pdf

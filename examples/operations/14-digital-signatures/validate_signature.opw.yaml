# validate_signature — Validate the PDF's digital signatures and emit a JSON report.
#
# Backend: optional backend — needs the Python backend or a system tool (see docs/python-setup.md).
# Runnable: uses the included input/ files. Hit Render, or swap in your own file.
version: 1
kind: pdf
inputs:
  - input/sample.pdf
operations:
  - validate_signature:
      to: output/sig.json
output:
  file: output/validate_signature.pdf
